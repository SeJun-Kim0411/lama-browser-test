<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브라우저 지우기 시험</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--sub:#6b7280;--line:#e3e6eb;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--card:#1f232b;--ink:#e8eaee;--sub:#9aa3b2;--line:#323844;--accent:#6b9bff}}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1{font-size:19px;margin:0 0 4px}
p{margin:4px 0 12px;color:var(--sub);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
button,label.btn{display:inline-block;font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin:0 6px 8px 0}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5}
#log{white-space:pre-wrap;font-size:12.5px;max-height:40vh;overflow:auto}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px}
.row figure{margin:0;text-align:center;font-size:12px;color:var(--sub)}
.row canvas,.row img{width:100%;aspect-ratio:1;border-radius:8px;background:#000;display:block}
textarea{width:100%;height:110px;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>
<h1>브라우저 지우기 시험 (LaMa)</h1>
<p>이 기기에서 AI 채우기(LaMa, 37MB)가 얼마나 빠른지 재요. 처음 한 번 모델을 받아요(와이파이 권장). 사진은 기기 밖으로 보내지 않아요.</p>
<div class="card">
  <button class="primary" id="bGpu">① 그래픽(WebGPU)로 시험</button>
  <button id="bCpu">② CPU(WASM)로 시험</button>
  <label class="btn">③ 내 사진으로 (가운데 띠 지우기)<input type="file" id="pick" accept="image/*" hidden></label>
</div>
<div class="card"><div id="log"></div></div>
<div id="out"></div>
<div class="card">
  <div style="font-size:13px;margin-bottom:6px">결과 요약 (길게 눌러 복사해서 보내 주세요)</div>
  <textarea id="sum" readonly></textarea>
</div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.all.min.js"></script>
<script>
const ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/';
const MODEL_URL = 'https://huggingface.co/othytenk/lama-int4-int8/resolve/main/lama_int4_int8_r4.onnx';
const $ = s => document.querySelector(s);
const summary = { ua: navigator.userAgent, isolated: self.crossOriginIsolated, cores: navigator.hardwareConcurrency, runs: [] };
function log(m) { $('#log').textContent += m + '\n'; $('#log').scrollTop = 1e9; }
function sum() { $('#sum').value = JSON.stringify(summary); }

// 여러 CPU 코어를 쓰려면 cross-origin isolation 필요 -> 서비스워커 등록 후 한 번 새로고침
(async () => {
  if (!self.crossOriginIsolated && 'serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('sw.js');
      if (!sessionStorage.getItem('coi-reloaded')) { sessionStorage.setItem('coi-reloaded', '1'); location.reload(); return; }
    } catch (e) { log('서비스워커 등록 실패(CPU 1개만 사용): ' + e.message); }
  }
  let gpu = '없음';
  try { if (navigator.gpu) { const a = await navigator.gpu.requestAdapter(); gpu = a ? ((a.info && (a.info.vendor + ' ' + a.info.architecture + ' ' + (a.info.description || ''))) || '있음') : '어댑터 없음'; } } catch (e) { gpu = '오류 ' + e.message; }
  summary.gpu = gpu;
  ort.env.wasm.wasmPaths = ORT;
  ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(8, navigator.hardwareConcurrency || 4) : 1;
  summary.threads = ort.env.wasm.numThreads;
  log(`기기 정보: 그래픽=${gpu} / CPU 코어=${navigator.hardwareConcurrency} / 사용할 스레드=${ort.env.wasm.numThreads} / 격리=${self.crossOriginIsolated}`);
  sum();
})();

let modelBuf = null;
async function getModel() {
  if (modelBuf) return modelBuf;
  const t = performance.now();
  let res = null, cache = null;
  try { cache = await caches.open('lama-v1'); res = await cache.match(MODEL_URL); } catch (e) {}
  if (!res) {
    log('모델 받는 중… (37MB)');
    res = await fetch(MODEL_URL);
    if (!res.ok) throw new Error('모델 받기 실패 ' + res.status);
    if (cache) { try { await cache.put(MODEL_URL, res.clone()); } catch (e) {} }
  } else log('모델: 기기에 저장된 것 사용');
  modelBuf = await res.arrayBuffer();
  log(`모델 준비 ${((performance.now() - t) / 1000).toFixed(1)}초`);
  return modelBuf;
}
function loadImg(src) { return new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; }); }
function toPixels(img, crop) {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d');
  if (crop) { const s = Math.min(img.width, img.height); x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 512, 512); }
  else x.drawImage(img, 0, 0, 512, 512);
  return { data: x.getImageData(0, 0, 512, 512).data, canvas: c };
}
let current = null;
async function prepareSample() {
  const [im, mk] = await Promise.all([loadImg('sample.png'), loadImg('sample_mask.png')]);
  return { name: '시험 그림', px: toPixels(im).data, mask: toPixels(mk).data, show: im };
}
function bandMask() {
  const m = new Uint8ClampedArray(512 * 512 * 4);
  for (let y = 220; y < 292; y++) for (let x = 70; x < 442; x++) m[(y * 512 + x) * 4] = 255;
  return m;
}
async function run(ep, input) {
  const btns = document.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
  try {
    input = input || current || (current = await prepareSample());
    const buf = await getModel();
    log(`--- ${ep} 준비 중…`);
    let t = performance.now();
    const sess = await ort.InferenceSession.create(buf, { executionProviders: [ep], extra: { session: { disable_quant_qdq: '1' } } });
    const prep = (performance.now() - t) / 1000;
    log(`${ep} 준비 ${prep.toFixed(1)}초`);
    const N = 512 * 512, img = new Float32Array(3 * N), mask = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      img[i] = input.px[i * 4] / 255; img[N + i] = input.px[i * 4 + 1] / 255; img[2 * N + i] = input.px[i * 4 + 2] / 255;
      mask[i] = input.mask[i * 4] > 127 ? 1 : 0;
    }
    const feeds = { image: new ort.Tensor('float32', img, [1, 3, 512, 512]), mask: new ort.Tensor('float32', mask, [1, 1, 512, 512]) };
    const times = []; let out;
    for (let k = 0; k < 3; k++) { t = performance.now(); out = await sess.run(feeds); times.push(+((performance.now() - t) / 1000).toFixed(2)); log(`${ep} ${k + 1}회째 ${times[k]}초`); }
    const o = out[sess.outputNames[0]].data;
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const x = c.getContext('2d'), id = x.createImageData(512, 512);
    for (let i = 0; i < N; i++) {
      for (let ch = 0; ch < 3; ch++) id.data[i * 4 + ch] = mask[i] > 0 ? Math.max(0, Math.min(255, o[ch * N + i])) : input.px[i * 4 + ch];
      id.data[i * 4 + 3] = 255;
    }
    x.putImageData(id, 0, 0);
    const row = document.createElement('div'); row.className = 'card';
    row.innerHTML = `<b>${input.name} · ${ep}</b> — 한 장 ${Math.min(...times.slice(1))}초`;
    const g = document.createElement('div'); g.className = 'row';
    const f1 = document.createElement('figure'); const a = input.show.cloneNode ? input.show.cloneNode() : input.show; f1.append(a, '원본');
    const f2 = document.createElement('figure'); f2.append(c, '지운 결과');
    g.append(f1, f2); row.append(g); $('#out').prepend(row);
    summary.runs.push({ ep, input: input.name, prep: +prep.toFixed(1), times, ok: true });
    await sess.release();
  } catch (e) {
    log(`${ep} 실패: ${e && e.message ? e.message : e}`);
    summary.runs.push({ ep, ok: false, error: String(e && e.message ? e.message : e).slice(0, 200) });
  } finally { btns.forEach(b => b.disabled = false); sum(); }
}
$('#bGpu').onclick = () => run('webgpu');
$('#bCpu').onclick = () => run('wasm');
$('#pick').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const img = await loadImg(URL.createObjectURL(f));
  const p = toPixels(img, true);
  current = { name: '내 사진', px: p.data, mask: bandMask(), show: p.canvas };
  log('내 사진을 골랐어요. ① 또는 ② 버튼을 누르세요.');
};
</script>
</body>
</html>
